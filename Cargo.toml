[workspace]
resolver = "2"
members = [
    "crates/auwsx-core",
    "crates/auwsx-tui",
    "crates/auwsx-web",
]

# Pinned to specific patch versions per project policy.
# DO NOT cargo fetch / build before running /sec on this dep set.
[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["vlwkaos <mgparkprint@gmail.com>"]
license = "MIT"
repository = "https://github.com/vlwkaos/auwsx"

[workspace.dependencies]
# Runtime
tokio = { version = "=1.40.0", features = ["full"] }
tokio-util = "=0.7.12"
async-trait = "=0.1.83"
futures = "=0.3.30"

# Errors / logging
anyhow = "=1.0.89"
thiserror = "=1.0.64"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }

# Serde
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
toml = "=0.8.19"

# Time / cron
chrono = { version = "=0.4.38", features = ["serde"] }
cron = "=0.12.1"

# DB
sqlx = { version = "=0.8.2", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }

# Filesystem watch (inbox)
notify = "=6.1.1"

# Process / IO
nix = { version = "=0.29.0", features = ["fs", "process", "signal"] }
directories = "=5.0.1"

# TUI
ratatui = "=0.28.1"
crossterm = "=0.28.1"
tui-textarea = "=0.6.1"

# Web (v0.2)
axum = { version = "=0.7.7", features = ["macros"] }
tower = "=0.5.1"
tower-http = { version = "=0.6.1", features = ["cors", "trace", "fs"] }
rust-embed = { version = "=8.5.0", features = ["axum"] }

# Local
wsx-core = { path = "../wsx/crates/wsx-core" }  # TODO: created by Step 1 (wsx-core extraction) — not yet present
auwsx-core = { path = "crates/auwsx-core" }
