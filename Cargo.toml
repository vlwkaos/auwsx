[workspace]
resolver = "2"
members = [
    "crates/auwsx-core",
    "crates/auwsx-tui",
    "crates/auwsx-web",
]

# Versions in workspace.dependencies are caret minimums (semver-compatible).
# Exact tree is locked via Cargo.lock (committed). For audit purposes,
# run `cargo audit` against Cargo.lock — not against this manifest.
[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["vlwkaos <mgparkprint@gmail.com>"]
license = "MIT"
repository = "https://github.com/vlwkaos/auwsx"

[workspace.dependencies]
# Runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"

# Errors / logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Time / cron
chrono = { version = "=0.4.38", features = ["serde"] }
cron = "0.12"

# DB
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }

# Filesystem watch (inbox)
notify = "6"

# Process / IO
nix = { version = "0.29", features = ["fs", "process", "signal"] }
directories = "5"

# TUI
ratatui = "0.28"
crossterm = "0.28"
tui-textarea = "0.6"

# Web (v0.2)
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
rust-embed = { version = "8", features = ["axum"] }

# Local
wsx-core = { path = "../wsx/crates/wsx-core" }
auwsx-core = { path = "crates/auwsx-core" }
